<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WPS Enterprise Drive</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7fc">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-up" viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20h-7a4 4 0 0 1-4-4V4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
      <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol>
      <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
      <symbol id="i-chev-up" viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11"/></symbol>
      <symbol id="i-chev-down" viewBox="0 0 24 24"><polyline points="7 13 12 18 17 13"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><polyline points="7 9 12 4 17 9"/><polyline points="7 15 12 20 17 15"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
      <symbol id="i-ill-empty" viewBox="0 0 120 96"><path d="M24 52 36 40h48l12 12" stroke-width="2.5"/><path d="M24 52v24a6 6 0 0 0 6 6h60a6 6 0 0 0 6-6V52" stroke-width="2.5"/><path d="M24 52h96" stroke-width="2.5" opacity=".4"/><rect x="47" y="12" width="26" height="34" rx="4" stroke-width="2.5"/><line x1="53" y1="22" x2="67" y2="22" stroke-width="2.5"/><line x1="53" y1="29" x2="63" y2="29" stroke-width="2.5"/><line x1="53" y1="36" x2="67" y2="36" stroke-width="2.5"/><line x1="101" y1="18" x2="101" y2="26" stroke-width="2.5"/><line x1="97" y1="22" x2="105" y2="22" stroke-width="2.5"/><line x1="17" y1="26" x2="17" y2="34" stroke-width="2.5"/><line x1="13" y1="30" x2="21" y2="30" stroke-width="2.5"/></symbol>
      <symbol id="i-ill-search" viewBox="0 0 120 96"><circle cx="52" cy="44" r="24" stroke-width="2.5"/><line x1="70" y1="62" x2="88" y2="80" stroke-width="3"/><line x1="42" y1="40" x2="62" y2="40" stroke-width="2.5"/><line x1="42" y1="48" x2="56" y2="48" stroke-width="2.5"/><line x1="103" y1="16" x2="103" y2="24" stroke-width="2.5"/><line x1="99" y1="20" x2="107" y2="20" stroke-width="2.5"/><line x1="16" y1="70" x2="16" y2="78" stroke-width="2.5"/><line x1="12" y1="74" x2="20" y2="74" stroke-width="2.5"/></symbol>
      <symbol id="i-ill-offline" viewBox="0 0 120 96"><g transform="translate(24 10) scale(3)" stroke-width=".85"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></g><line x1="34" y1="82" x2="90" y2="18" stroke-width="3"/></symbol>
    </defs>
  </svg>

  <div id="aurora" aria-hidden="true"><span></span><span></span></div>

  <noscript><div class="noscript">此页面需要启用 JavaScript 才能管理文件。</div></noscript>

  <section id="auth-screen" class="auth-screen" aria-labelledby="auth-title">
    <div class="auth-brand"><span class="brand-mark" aria-hidden="true">W</span><span>WPS Drive</span></div>
    <div class="auth-card">
      <div class="auth-heading">
        <p class="auth-kicker">PRIVATE CLOUD</p>
        <h1 id="auth-title">欢迎回来</h1>
        <p id="auth-subtitle">登录后管理你的 WPS 文件</p>
      </div>
      <form id="login-form" class="auth-form" novalidate>
        <label class="auth-field"><span>用户名</span><input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" required></label>
        <label class="auth-field"><span>密码</span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-submit" class="primary auth-submit" type="submit">登录</button>
      </form>
      <p id="auth-message" class="auth-message" role="alert" aria-live="polite"></p>
      <p class="auth-footnote">使用安装时设置的适配器账号登录；该账号同时用于 WebDAV。</p>
    </div>
    <p class="auth-security"><span class="connection-dot connected" aria-hidden="true"></span>你的连接由当前服务保护</p>
  </section>

  <div id="app-ui" class="app-ui hidden">

  <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
    <svg class="drop-frame" aria-hidden="true"><rect pathLength="1000"/></svg>
    <div class="drop-overlay-card" role="status" aria-live="polite">
      <span class="drop-overlay-icon" aria-hidden="true"><svg class="icon lg"><use href="#i-upload"/></svg></span>
      <strong>松开即可上传</strong>
      <span>将保存到当前目录：<b id="drop-target">/</b></span>
    </div>
  </div>

  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div class="brand-copy">
          <div class="brand-title" id="brand-title">WPS Enterprise Drive</div>
          <div class="brand-subtitle">WebDAV Adapter</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="up-button" class="icon-button" type="button" title="返回上一级（Alt+↑）" aria-label="返回上一级"><svg class="icon"><use href="#i-up"/></svg></button>
        <button id="refresh-button" class="icon-button" type="button" title="刷新目录" aria-label="刷新目录"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <span class="header-divider" aria-hidden="true"></span>
        <button id="settings-button" class="icon-button" type="button" title="设置云盘名称" aria-label="设置云盘名称"><svg class="icon"><use href="#i-sliders"/></svg></button>
        <button id="theme-button" class="icon-button" type="button" title="切换主题" aria-label="切换主题"><svg class="icon"><use id="theme-icon" href="#i-sun"/></svg></button>
        <button id="logout-button" class="icon-button logout-button" type="button" title="退出登录" aria-label="退出登录"><svg class="icon"><use href="#i-x"/></svg></button>
        <div id="view-toggle" class="view-toggle" data-view="list" role="group" aria-label="视图切换">
          <span class="view-thumb" aria-hidden="true"></span>
          <button id="view-list-button" type="button" title="列表视图" aria-label="列表视图" aria-pressed="true"><svg class="icon"><use href="#i-list"/></svg></button>
          <button id="view-grid-button" type="button" title="卡片视图" aria-label="卡片视图" aria-pressed="false"><svg class="icon"><use href="#i-grid"/></svg></button>
        </div>
        <button id="folder-button" type="button"><svg class="icon"><use href="#i-plus"/></svg><span class="label">新建文件夹</span></button>
        <button id="upload-button" class="primary" type="button"><svg class="icon"><use href="#i-upload"/></svg><span class="label">上传文件</span></button>
        <input id="file-input" class="hidden" type="file" multiple>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="workspace-head" aria-labelledby="folder-title">
      <div>
        <div class="eyebrow">企业空间</div>
        <h1 id="folder-title">WPS Enterprise Drive</h1>
        <p id="folder-note" class="workspace-note">管理 WPS Enterprise Drive 中的文件和文件夹</p>
      </div>
      <div id="connection" class="connection checking" role="status" aria-live="polite">
        <span class="connection-dot" aria-hidden="true"></span><span id="connection-label">正在检查 WPS</span>
      </div>
    </section>

    <div class="navigation-row">
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
      <label class="search" for="search-input">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="搜索当前目录（按 / 聚焦）" autocomplete="off">
      </label>
    </div>

    <section class="panel" aria-label="文件列表">
      <div class="panel-toolbar">
        <div id="panel-summary" class="panel-summary">正在读取...</div>
        <div class="toolbar-right">
          <label class="sort-group" for="sort-select">
            <svg class="icon" aria-hidden="true"><use href="#i-sort"/></svg>
            <select id="sort-select" aria-label="排序方式">
              <option value="auto">默认排序</option>
              <option value="name">按名称</option>
              <option value="size">按大小</option>
              <option value="time">按修改时间</option>
            </select>
          </label>
          <button id="sort-dir-button" class="icon-button small" type="button" title="切换升降序" aria-label="切换升降序"><svg class="icon"><use id="sort-dir-icon" href="#i-chev-up"/></svg></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <span id="path-value" class="meta path-value">/</span>
        </div>
      </div>
      <div id="list-head" class="list-head" role="row">
        <div class="cell name" role="columnheader" aria-sort="none"><button type="button" data-sort="name" class="sort-button">名称<svg class="icon sort-ic" aria-hidden="true"><use href="#i-sort"/></svg></button></div>
        <div class="cell type" role="columnheader">类型</div>
        <div class="cell size" role="columnheader" aria-sort="none"><button type="button" data-sort="size" class="sort-button">大小<svg class="icon sort-ic" aria-hidden="true"><use href="#i-sort"/></svg></button></div>
        <div class="cell time" role="columnheader" aria-sort="none"><button type="button" data-sort="time" class="sort-button">修改时间<svg class="icon sort-ic" aria-hidden="true"><use href="#i-sort"/></svg></button></div>
        <div class="cell ops" role="columnheader"><span class="ops-head">操作</span></div>
      </div>
      <div id="entries" class="list-body" role="table" aria-label="文件列表"></div>
      <div id="skeleton" class="hidden" aria-hidden="true"></div>
      <div id="empty" class="empty hidden"></div>
    </section>

    <div class="status-row">
      <span id="status" role="status" aria-live="polite">正在读取...</span>
    </div>
  </main>

  <aside id="upload-tray" class="upload-tray" role="region" aria-label="上传队列" aria-hidden="true">
    <div class="tray-head">
      <svg class="icon accent" aria-hidden="true"><use href="#i-upload"/></svg>
      <span class="tray-title">上传队列</span>
      <span id="tray-count" class="tray-count"></span>
      <button id="tray-cancel" class="icon-button small" type="button" title="取消上传" aria-label="取消上传"><svg class="icon"><use href="#i-stop"/></svg></button>
      <button id="tray-close" class="icon-button small hidden" type="button" title="关闭" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="tray-current" id="tray-current">
      <div class="tray-ring-wrap" aria-hidden="true">
        <svg class="tray-ring" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="19"/>
          <circle class="ring-fg" id="tray-ring" cx="22" cy="22" r="19" pathLength="100"/>
        </svg>
        <span id="tray-percent" class="tray-percent">0%</span>
      </div>
      <div class="tray-file">
        <div id="tray-name" class="tray-name">-</div>
        <div id="tray-speed" class="tray-speed">-</div>
      </div>
    </div>
    <ul id="tray-list" class="tray-list"></ul>
  </aside>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="modal">
    <form id="modal-form" class="modal-card" method="dialog">
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-message" class="modal-message hidden"></p>
      <label id="modal-label" class="modal-label">
        <span id="modal-label-text"></span>
        <input id="modal-input" class="modal-input" type="text" autocomplete="off">
      </label>
      <div class="modal-actions">
        <button id="modal-cancel" type="button">取消</button>
        <button id="modal-submit" class="primary" type="submit">确定</button>
      </div>
    </form>
  </dialog>

  <dialog id="picker">
    <form class="modal-card picker-card" method="dialog" onsubmit="return false;">
      <h2 class="modal-title">移动到…</h2>
      <p id="picker-subtitle" class="modal-message">选择目标文件夹</p>
      <div class="picker-nav">
        <button id="picker-up" class="icon-button small" type="button" title="上一级" aria-label="上一级"><svg class="icon"><use href="#i-chev-up"/></svg></button>
        <span id="picker-path" class="picker-path">/</span>
      </div>
      <div id="picker-list" class="picker-list" role="list"></div>
      <div class="modal-actions">
        <button id="picker-cancel" type="button">取消</button>
        <button id="picker-move" class="primary" type="button">移动到这里</button>
      </div>
    </form>
  </dialog>

  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
