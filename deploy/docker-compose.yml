services:
  wps-adapter:
    # env_file supplies variables inside the container. Compose substitutes
    # the host mapping below from the shell environment, so export
    # ADAPTER_BIND and ADAPTER_PORT before running docker compose when using
    # a non-default host port.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: "${WPS_ADAPTER_UID:-1000}"
        APP_GID: "${WPS_ADAPTER_GID:-1000}"
    restart: unless-stopped
    user: "${WPS_ADAPTER_UID:-1000}:${WPS_ADAPTER_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/wps-adapter/wps-adapter.env
    environment:
      ADAPTER_BIND: 0.0.0.0
    ports:
      - "${ADAPTER_BIND:-0.0.0.0}:${ADAPTER_PORT:-54321}:${ADAPTER_PORT:-54321}"
    volumes:
      - /etc/wps-adapter/secrets:/etc/wps-adapter/secrets:rw
