services:
  wps-adapter:
    # env_file supplies variables inside the container. Compose substitutes
    # the host mapping below from the shell environment, so export
    # ADAPTER_BIND and ADAPTER_PORT before running docker compose when using
    # a non-default host port.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: "${WPS_ADAPTER_DOCKER_BASE_IMAGE:-python:3.12-slim}"
        APP_UID: "${WPS_ADAPTER_UID:-1000}"
        APP_GID: "${WPS_ADAPTER_GID:-1000}"
    restart: unless-stopped
    user: "${WPS_ADAPTER_UID:-1000}:${WPS_ADAPTER_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/wps-adapter/wps-adapter.env
    environment:
      ADAPTER_BIND: 0.0.0.0
    ports:
      - "${ADAPTER_BIND:-0.0.0.0}:${ADAPTER_PORT:-54321}:${ADAPTER_PORT:-54321}"
    volumes:
      # The directory must be writable because rotation creates a temporary
      # file beside the target before atomically replacing it. Overlay the
      # Basic Auth files as read-only mounts. Keep custom file names in sync
      # with the two entries below if the env file overrides their paths.
      - /etc/wps-adapter/secrets:/etc/wps-adapter/secrets:rw
      - /var/lib/wps-adapter/uploads:/var/lib/wps-adapter/uploads:rw
      - /etc/wps-adapter/secrets/adapter-username:/etc/wps-adapter/secrets/adapter-username:ro
      - /etc/wps-adapter/secrets/adapter-password:/etc/wps-adapter/secrets/adapter-password:ro
