name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Run Go tests
        working-directory: go
        run: go test ./...
      - name: Vet Go code
        working-directory: go
        run: go vet ./...
      - name: Build static service
        working-directory: go
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/wps-adapter ./cmd/wps-adapter
      - name: Check shell installers
        run: bash -n scripts/install-native.sh scripts/install-docker.sh scripts/uninstall.sh

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: PYTHONPATH=src python -m compileall -q src tests wps_login.py
      - name: Check shell installers
        run: bash -n scripts/install-native.sh scripts/install-docker.sh
