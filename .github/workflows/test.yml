name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Run Go tests
        working-directory: go
        run: go test ./...
      - name: Vet Go code
        working-directory: go
        run: go vet ./...
      - name: Build static service
        working-directory: go
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/wps-adapter ./cmd/wps-adapter
      - name: Check shell installers
        run: bash -n scripts/install-native.sh scripts/install-docker.sh scripts/uninstall.sh
      - name: Check release manifest
        run: bash tools/build-release-manifest.sh --check
